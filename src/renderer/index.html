<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; style-src 'self'; script-src 'self';">
  <title>File Updater</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <!-- ── Sidebar ── -->
    <aside class="sidebar">
      <div class="brand">
        <span class="brand-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/>
            <polyline points="3.27 6.96 12 12.01 20.73 6.96"/>
            <line x1="12" y1="22.08" x2="12" y2="12"/>
          </svg>
        </span>
        <span class="brand-name">File Updater</span>
      </div>

      <nav class="nav">
        <a class="nav-item active" data-view="updater">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
          <span>Updater</span>
        </a>
        <a class="nav-item" data-view="settings">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33h0a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51h0a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82v0a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
          <span>Settings</span>
        </a>
        <a class="nav-item" data-view="logs">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
          <span>Logs</span>
        </a>
        <a class="nav-item" data-view="about">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
          <span>About</span>
        </a>
      </nav>

      <div class="status-indicator">
        <span class="status-dot"></span>
        <span id="status-text">Ready</span>
      </div>
    </aside>

    <!-- ── Main content ── -->
    <main class="content">
      <!-- ─ Top inputs ─ -->
      <section class="row inputs-row">
        <div class="card input-card">
          <label class="input-label" for="manifest-url">Manifest URL</label>
          <div class="field-control">
            <svg class="field-icon" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
            <input type="text" id="manifest-url" placeholder="https://example.com/manifest.json">
            <button class="icon-btn" id="btn-copy-url" title="Copy URL" type="button">
              <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
            </button>
          </div>
        </div>

        <div class="card input-card folder-card">
          <label class="input-label" for="folder-path">Target Folder</label>
          <div class="field-control with-button">
            <svg class="field-icon" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
            <input type="text" id="folder-path" readonly placeholder="Select a folder…">
            <button id="btn-browse" class="btn btn-outline btn-sm">Browse</button>
          </div>
        </div>
      </section>

      <!-- ─ Metadata cards ─ -->
      <section id="manifest-info" class="row meta-row hidden">
        <div class="card meta-card">
          <span class="meta-icon meta-icon-blue">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="4"/><path d="M9 9h6v6H9z"/></svg>
          </span>
          <div class="meta-text">
            <div class="meta-label">App</div>
            <div class="meta-value" id="manifest-name">—</div>
          </div>
        </div>

        <div class="card meta-card">
          <span class="meta-icon meta-icon-violet">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/><line x1="7" y1="7" x2="7.01" y2="7"/></svg>
          </span>
          <div class="meta-text">
            <div class="meta-label">Version</div>
            <div class="meta-value" id="manifest-version">—</div>
          </div>
        </div>

        <div class="card meta-card">
          <span class="meta-icon meta-icon-info">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
          </span>
          <div class="meta-text">
            <div class="meta-label">Files</div>
            <div class="meta-value" id="manifest-file-count">—</div>
          </div>
        </div>

        <div class="card meta-card">
          <span class="meta-icon meta-icon-success">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
          </span>
          <div class="meta-text">
            <div class="meta-label">Scan Result</div>
            <div class="meta-value" id="scan-result-text">Not scanned</div>
          </div>
        </div>
      </section>

      <!-- ─ Body split: left column / right actions ─ -->
      <div class="body-grid">
        <!-- Left column -->
        <div class="left-col">
          <!-- Overall progress card -->
          <section class="card overall-card">
            <div class="card-head">
              <div class="card-title">Overall Progress</div>
              <div class="card-title-aux" id="overall-percent">0%</div>
            </div>
            <div class="progress-bar-container">
              <div id="overall-bar" class="progress-bar"></div>
            </div>
            <div class="stat-grid">
              <div class="stat">
                <div class="stat-value" id="stat-scanned">0 / 0 files</div>
                <div class="stat-label">Scanned</div>
              </div>
              <div class="stat">
                <div class="stat-value" id="stat-downloaded">0 B / 0 B</div>
                <div class="stat-label">Downloaded</div>
              </div>
              <div class="stat">
                <div class="stat-value" id="stat-speed">0 B/s</div>
                <div class="stat-label">Speed</div>
              </div>
              <div class="stat">
                <div class="stat-value" id="stat-elapsed">00:00:00</div>
                <div class="stat-label">Elapsed</div>
              </div>
            </div>
            <!-- Hidden legacy stats sink for renderer.js -->
            <span id="overall-stats" class="hidden"></span>
            <div class="card-footer">
              <label class="toggle-label">
                <span class="toggle">
                  <input type="checkbox" id="chk-orphans">
                  <span class="toggle-track"><span class="toggle-thumb"></span></span>
                </span>
                <span class="toggle-text">Delete orphan files</span>
                <span class="info-icon" title="Removes files that are not in the manifest" aria-hidden="true">
                  <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
                </span>
              </label>
            </div>
          </section>

          <!-- Files card -->
          <section class="card files-card">
            <div class="card-head">
              <div class="card-title">Files</div>
              <div class="card-head-tools">
                <button class="icon-btn" title="Search" type="button">
                  <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                </button>
                <button class="icon-btn" title="Filter" type="button">
                  <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="6" x2="20" y2="6"/><line x1="7" y1="12" x2="17" y2="12"/><line x1="10" y1="18" x2="14" y2="18"/></svg>
                </button>
              </div>
            </div>
            <div class="file-list-container">
              <table id="file-table">
                <thead>
                  <tr>
                    <th class="col-status">Status</th>
                    <th class="col-file">File</th>
                    <th class="col-size">Size</th>
                    <th class="col-progress">Progress</th>
                  </tr>
                </thead>
                <tbody id="file-tbody"></tbody>
              </table>
            </div>
            <div class="card-footer files-footer">
              <span id="files-count">Showing 0 of 0 files</span>
              <span class="files-summary" id="files-summary">
                <span class="status-dot status-dot-success"></span>
                <span id="files-summary-text">Idle</span>
              </span>
            </div>
          </section>
        </div>

        <!-- Right column -->
        <div class="right-col">
          <!-- Actions card -->
          <section class="card actions-card">
            <div class="card-head">
              <div class="card-title">Actions</div>
            </div>
            <button id="btn-scan" class="action-btn action-primary" disabled>
              <span class="action-icon">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
              </span>
              <span class="action-text">
                <span class="action-title">Scan &amp; Compare</span>
                <span class="action-sub">Check remote manifest</span>
              </span>
            </button>
            <button id="btn-update" class="action-btn action-secondary" disabled>
              <span class="action-icon">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
              </span>
              <span class="action-text">
                <span class="action-title">Start Update</span>
                <span class="action-sub">Download and update files</span>
              </span>
            </button>
            <button id="btn-cancel" class="action-btn action-danger" disabled>
              <span class="action-icon">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="6" width="12" height="12" rx="1"/></svg>
              </span>
              <span class="action-text">
                <span class="action-title">Cancel</span>
                <span class="action-sub">Stop current operation</span>
              </span>
            </button>
          </section>

          <!-- Executables card -->
          <section id="exe-section" class="card exe-card hidden">
            <div class="card-head">
              <div class="card-title">Executables</div>
            </div>
            <div id="exe-list" class="exe-list"></div>
          </section>
        </div>
      </div>

      <!-- ─ Logs ─ -->
      <section class="card log-panel">
        <div class="card-head">
          <div class="card-title">Logs</div>
          <div class="card-head-tools">
            <button class="icon-btn" id="btn-clear-logs" title="Clear" type="button">
              <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/></svg>
              <span>Clear</span>
            </button>
            <button class="icon-btn" title="Collapse" type="button">
              <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
            </button>
          </div>
        </div>
        <div id="log-output"></div>
      </section>
    </main>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
